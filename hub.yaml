esquema: 1
nome: Kora
resumo: Bot do Telegram que transforma links em notas organizadas no Obsidian, com transcrição do áudio e categorização por IA.
descricao: Você manda o link de um Reel, TikTok, tweet, vídeo ou artigo para o bot no Telegram. A Kora extrai o conteúdo, transcreve o áudio localmente, pede a uma IA resumo, pontos-chave, categoria e tags e grava a nota pronta no vault do Obsidian, em pastas por categoria. Dá para buscar pelo bot, corrigir a categoria respondendo ao aviso e processar a fila em lotes pelo systemd.
status: no-ar
visibilidade: parcial
motivo: Uso pessoal; o repositório é privado e ainda não há versão estável para compartilhar o código.
tecnologias: [Python, SQLite, yt-dlp, faster-whisper, Telegram, Obsidian]
icone: docs/img/kora.png
cor: "#22d3ee"
forma: livros
arquitetura:
  texto: Um bot sempre ligado grava os links numa fila local; um worker em lotes extrai, transcreve, resume com IA e escreve as notas no vault.
  fluxo: [Telegram, Bot, Fila SQLite, Worker em lotes, IA, Vault do Obsidian]
proximos:
  - Interface configurável para ajustar IA, idioma, intervalo dos lotes e categorias
  - Orquestrador de IA com fallback entre provedores
  - Bot no WhatsApp, além do Telegram
  - Tradução de links em outros idiomas para o idioma escolhido
  - Interface para navegar pelos links salvos
