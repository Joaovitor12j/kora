<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Kora{% endblock %}</title>
<link rel="icon" href="/static/kora-avatar.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Unbounded:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/kora.css">
</head>
<body>
<a class="pular" href="#principal">Ir para o conteúdo</a>
{% if remoto %}<p class="aviso-remoto" role="note">Acesso de fora{% if usuario %} como {{ usuario }}{% endif %}. O que você muda aqui vale no computador da Kora.</p>{% endif %}
<header class="topo">
  <a class="marca" href="/" aria-label="Kora, início">
    <img class="avatar" src="/static/kora-avatar.webp" width="36" height="36" alt="">
    <span>kora</span>
  </a>
  <nav class="abas" aria-label="Seções">
    <a href="/" {% if pagina == "salvos" %}aria-current="page"{% endif %}>Salvos</a>
    <a href="/fila" {% if pagina == "fila" %}aria-current="page"{% endif %}>Fila</a>
    <a href="/ajustes" {% if pagina == "ajustes" %}aria-current="page"{% endif %}>Ajustes</a>
  </nav>
</header>
<main id="principal">
{% block conteudo %}{% endblock %}
</main>
<div id="aviso" class="aviso" role="status" aria-live="polite"></div>
<script src="/static/kora.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
