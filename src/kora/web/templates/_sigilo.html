{#- Sigilos: traço chapado e ângulos de 45°, o vocabulário do k da marca (haste de marcador + chevron). Cor vem do CSS (currentColor). -#}
{% macro sigilo(categoria, tam=40) -%}
{%- set k = sigilo_chave(categoria) -%}
<svg class="sigilo k-{{ k }}" viewBox="0 0 48 48" width="{{ tam }}" height="{{ tam }}" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" aria-hidden="true" focusable="false">
{%- if k == "cruz" -%}
  <path d="M18 12 6 24 18 36M30 12 42 24 30 36"/>
{%- elif k == "orbita" -%}
  <path d="M24 5 43 24 24 43 5 24Z"/><path d="M24 17 31 24 24 31 17 24Z" fill="currentColor" stroke="none"/>
{%- elif k == "espiral" -%}
  <path d="M9 9 24 24 39 9M9 39 24 24 39 39"/>
{%- elif k == "degraus" -%}
  <path d="M5 40H17V28H29V16H43"/>
{%- elif k == "moeda" -%}
  <circle cx="24" cy="24" r="18"/><path d="M24 15 33 24 24 33 15 24Z" fill="currentColor" stroke="none"/>
{%- elif k == "pulso" -%}
  <path d="M3 26H13L19 18 27 34 33 26H45"/>
{%- elif k == "telhado" -%}
  <path d="M5 23 24 6 43 23M12 21V42H36V21"/>
{%- elif k == "chama" -%}
  <path d="M24 5 38 21V31L24 43 10 31V21Z"/><path d="M17 32 24 25 31 32"/>
{%- elif k == "sorriso" -%}
  <path d="M10 28 24 40 38 28"/><path d="M12 11H18V17H12ZM30 11H36V17H30Z" fill="currentColor" stroke="none"/>
{%- elif k == "ponto" -%}
  <path d="M24 10 38 24 24 38 10 24Z" fill="currentColor" stroke="none"/>
{%- else -%}
  <path d="M14 5H34V43L24 34 14 43Z"/>
{%- endif -%}
</svg>
{%- endmacro %}
