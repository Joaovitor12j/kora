[project]
name = "kora"
version = "0.1.0"
description = "Bot do Telegram que salva links como notas no Obsidian"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=22",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "yt-dlp[default]",
    "curl_cffi",
    "trafilatura>=2",
    "faster-whisper>=1.1",
    "av<16",  # PyAV 19 quebra o faster-whisper (metadata_errors)
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
kora-bot = "kora.bot:main"
kora-worker = "kora.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
