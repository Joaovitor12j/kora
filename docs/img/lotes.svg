<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 296" width="960" height="296" font-family="-apple-system, 'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Quando o worker roda</title>
<desc id="d">Linha do tempo: o bot fica sempre ligado e a fila acumula links; o primeiro lote roda 1 hora depois de ligar o computador e os seguintes 8 horas depois do fim do anterior.</desc>
<defs>
<marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="295" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<rect x="30" y="24" width="900" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<text x="480" y="52" font-size="14.5" font-weight="bold" fill="#1f2328" text-anchor="middle" font-style="normal">Bot sempre ligado: recebe os links na hora e responde /buscar, /status e correções</text>
<rect x="30" y="82" width="900" height="44" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.4"/>
<text x="50" y="109" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start" font-style="normal">Fila (SQLite)</text>
