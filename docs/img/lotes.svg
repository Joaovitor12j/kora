<text x="854" y="108.5" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="normal">link</text>
<text x="480" y="144" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="italic">links chegam a qualquer hora e esperam o próximo lote</text>
<line x1="40" y1="206" x2="925" y2="206" stroke="#57606a" stroke-width="2" marker-end="url(#seta)"/>
<text x="925" y="236" font-size="12" font-weight="normal" fill="#57606a" text-anchor="end" font-style="normal">tempo, com o computador ligado</text>
